<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PBL Student Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#4facfe,#00f2fe);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:380px;
background:#fff;
padding:30px;
border-radius:12px;
box-shadow:0 10px 20px rgba(0,0,0,.3);
}

h1{
text-align:center;
color:#0077b6;
margin-bottom:10px;
}

p{
text-align:center;
margin-bottom:20px;
color:#555;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input[type=email],
input[type=password]{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;
}

.remember{
margin-top:15px;
}

button{
width:100%;
padding:12px;
margin-top:20px;
background:#0077b6;
color:white;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#023e8a;
}

.footer{
text-align:center;
margin-top:20px;
}

.footer a{
color:#0077b6;
text-decoration:none;
font-weight:bold;
}

.footer a:hover{
text-decoration:underline;
}

</style>

</head>

<body>

<div class="container">

<h1>PBL Login</h1>

<p>Project-Based Learning Portal</p>

<form action="dashboard.html">

<label>Email ID</label>

<input type="email"
placeholder="Enter Email"
required>

<label>Password</label>

<input type="password"
placeholder="Enter Password"
required>

<div class="remember">

<input type="checkbox">

Remember Me

</div>

<button type="submit">

Login

</button>

</form>

<div class="footer">

New User?

<a href="register.html">

Register Here

</a>

</div>

</div>

</body>

</html>
