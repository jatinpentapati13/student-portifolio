<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PBL Student Registration</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(to right,#4facfe,#00f2fe);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:550px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

header{
    text-align:center;
    margin-bottom:20px;
}

header h1{
    color:#0077b6;
}

fieldset{
    border:2px solid #0077b6;
    border-radius:8px;
    padding:20px;
}

legend{
    color:#0077b6;
    font-weight:bold;
    padding:0 10px;
}

label{
    display:block;
    margin-top:12px;
    font-weight:bold;
}

input, select, textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #bbb;
    border-radius:5px;
}

.gender{
    display:flex;
    gap:20px;
    margin-top:10px;
}

.gender label{
    font-weight:normal;
}

.gender input{
    width:auto;
}

.buttons{
    display:flex;
    justify-content:space-between;
    margin-top:25px;
}

button{
    width:48%;
    padding:12px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

.register{
    background:#0077b6;
    color:white;
}

.register:hover{
    background:#023e8a;
}

.reset{
    background:#6c757d;
    color:white;
}

.reset:hover{
    background:#495057;
}

footer{
    text-align:center;
    margin-top:20px;
}

footer a{
    color:#0077b6;
    text-decoration:none;
    font-weight:bold;
}

footer a:hover{
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="container">

<header>
<h1>PBL Student Registration</h1>
<p>Create Your New Account</p>
</header>

<form action="index.html" method="post">

<fieldset>

<legend>Registration Form</legend>

<label>Full Name</label>
<input type="text" name="fullname" required>

<label>Email Address</label>
<input type="email" name="email" required>

<label>Password</label>
<input type="password" name="password" required>

<label>Confirm Password</label>
<input type="password" name="confirmPassword" required>

<label>Mobile Number</label>
<input type="tel" pattern="[0-9]{10}" placeholder="10-digit Mobile Number" required>

<label>Date of Birth</label>
<input type="date" required>

<label>Gender</label>

<div class="gender">
<label><input type="radio" name="gender" required> Male</label>
<label><input type="radio" name="gender"> Female</label>
<label><input type="radio" name="gender"> Other</label>
</div>

<label>Department</label>

<select required>
<option value="">Select Department</option>
<option>Computer Science & Engineering</option>
<option>Information Technology</option>
<option>Artificial Intelligence & Machine Learning</option>
<option>Data Science</option>
<option>Electronics & Communication Engineering</option>
<option>Electrical Engineering</option>
<option>Mechanical Engineering</option>
<option>Civil Engineering</option>
</select>

<label>Project Title</label>
<input type="text" placeholder="Enter Project Title">

<label>Address</label>
<textarea rows="4"></textarea>

<label>
<input type="checkbox" required style="width:auto;">
I agree to the Terms & Conditions
</label>

<div class="buttons">

<button type="submit" class="register">
Register
</button>

<button type="reset" class="reset">
Reset
</button>

</div>

</fieldset>

</form>

<footer>

Already Registered?

<a href="index.html">
Login Here
</a>

</footer>

</div>

</body>
</html>
