<!DOCTYPE html>
<html>
<head>
    <title>HTML TABLE EXAMPLE</title>
</head>
<body>

<h2>Student Marks Report</h2>

<table border="2">
    <!-- Table caption -->
    <caption>Student Information Table</caption>

    <!-- Table header -->
    <thead>
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Course</th>
            <th>Marks</th>
            <th>Grade</th>
        </tr>
    </thead>

    <!-- Table body -->
    <tbody>
        <tr>
            <td>101</td>
            <td>Rahul</td>
            <td>B.Tech</td>
            <td>92</td>
            <td>A+</td>
        </tr>
        <tr>
            <td>102</td>
            <td>Priya</td>
            <td>BCA</td>
            <td>85</td>
            <td>A</td>
        </tr>
    </tbody>

    <!-- Table footer -->
    <tfoot>
        <tr>
            <td colspan="3">Average Marks</td>
            <td>88.5</td>
            <td>A</td>
        </tr>
    </tfoot>

</table>

</body>
</html>
